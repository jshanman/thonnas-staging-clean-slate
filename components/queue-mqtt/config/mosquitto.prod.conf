# Mosquitto MQTT Broker Production Configuration
# For production environment with security and authentication

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Network - MQTT with TLS (Port 8883)
listener 8883
protocol mqtt
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key
require_certificate false

# Network - WebSocket with TLS (Port 443)
listener 443
protocol websockets
cafile /mosquitto/config/ca.crt
certfile /mosquitto/config/server.crt
keyfile /mosquitto/config/server.key

# Authentication — create passwd (mosquitto_passwd) and acl from *.example templates
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Connection limits
max_connections 10000
max_queued_messages 1000

# Message limits
max_inflight_messages 100

# Message size limit (100KB)
message_size_limit 102400

# Keep alive settings
max_keepalive 3600

# System messages ($SYS/#)
sys_interval 60

# Automatic ID
connection_messages true

# Security - Prevent DoS attacks
set_tcp_nodelay true

# Security - Client timeout
persistent_client_expiration 1h

# Performance - Memory limits
max_packet_size 1024KB

# Quality of Service
max_queued_bytes 0
max_inflight_bytes 0
max_packet_size 0

# Connection persistence
persistent_client_id_prefix web prod

# Bridge configuration (if needed)
# connection mqtt-bridge
# address mqtt2.thonnas.com:8883
# start_type automatic
# topic # out
# topic # in
# bridge_protocol_version mqttv50


