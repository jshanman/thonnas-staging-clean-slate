# Mosquitto MQTT Broker Configuration
# Development: anonymous access; see acl.example / passwd.example for production auth

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Network
listener 1883
protocol mqtt

# WebSocket listener for web clients
listener 9001
protocol websockets

# Authentication (disabled for development)
allow_anonymous true

# Production: copy mosquitto.prod.conf, generate passwd from passwd.example,
# copy acl.example to acl, then enable:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# Connection limits
max_connections 10000
max_queued_messages 1000

# Message limits
max_inflight_messages 100

# Message size limit (100KB)
message_size_limit 102400

# Keep alive settings
max_keepalive 3600

# System messages ($SYS/#) for broker metrics
sys_interval 60
# Note: sys_announce_retained and sys_retain_available are not valid in this Mosquitto version
# System topics are always available when sys_interval is set

# Automatic ID
connection_messages true




